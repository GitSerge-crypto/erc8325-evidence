name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,evm]"

      - name: Unit and CLI tests
        run: pytest -q

      - name: Vectors reproduce byte-for-byte
        # The conformance vectors must rebuild to the exact expected bundle_hash
        # on every supported interpreter, and bundle bytes must be deterministic.
        run: pytest -q tests/test_vectors.py tests/test_bundle.py

  build:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Wheel smoke test on a conformance vector
        # Installed wheel (not the source tree) must reproduce the vector hash.
        run: |
          python -m venv /tmp/wv
          /tmp/wv/bin/python -m pip install --upgrade pip
          /tmp/wv/bin/python -m pip install dist/*.whl
          cd "$GITHUB_WORKSPACE/vectors"
          /tmp/wv/bin/python -c "import json;v=json.load(open('positive_ed25519.json'));json.dump(v['payload'],open('/tmp/payload.json','w'))"
          got=$(/tmp/wv/bin/python -m aot_ev1.cli canonical /tmp/payload.json | sed -n 's/^evidence_hash: //p')
          want=$(python -c "import json;print(json.load(open('positive_ed25519.json'))['expect']['evidence_hash'])")
          echo "got=$got want=$want"
          test "$got" = "$want"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
