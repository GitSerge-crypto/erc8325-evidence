name: Notarize release artifacts

# Догфудинг: каждый релиз нотаризуется в AOTrust (free tier), Shield ID
# пишется в summary джобы и может быть вставлен бейджем в README.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build artifacts
        run: |
          python -m pip install --upgrade build
          python -m build .
      - name: Notarize sdist + wheel in AOTrust
        id: notarize
        uses: GitSerge-crypto/aotrust-skills/action@v1
        with:
          files: 'dist/*'
      - name: Summary
        run: |
          echo "### This release is anchored" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Shield ID: **${ steps.notarize.outputs.shield_id }**" >> $GITHUB_STEP_SUMMARY
          echo "Verify: ${ steps.notarize.outputs.verify_url }" >> $GITHUB_STEP_SUMMARY
