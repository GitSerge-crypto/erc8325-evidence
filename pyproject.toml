[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aot-ev1"
version = "0.1.1"
description = "AOT-EV1 — deterministic evidence layer for the ERC-8325 evidenceHash slot"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "AOTrust", email = "legal@aotrust.link"}]
keywords = ["evidence", "attestation", "erc-8325", "jcs", "ed25519", "provenance"]
dependencies = ["pynacl>=1.5"]

[project.optional-dependencies]
evm = ["eth-account>=0.13"]
anchor = []
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
aotev = "aot_ev1.cli:main"

[tool.setuptools.packages.find]
include = ["aot_ev1*"]

[tool.setuptools.package-data]
aot_ev1 = ["schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
